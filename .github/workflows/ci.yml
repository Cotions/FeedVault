name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Tests
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint UI
        working-directory: frontend
        run: npm run lint

      - name: Test UI
        working-directory: frontend
        run: npm test

      - name: Build UI
        working-directory: frontend
        run: npm run build

  # Browser smoke tests (frontend/e2e) against a throwaway demo instance:
  # invented posts and fake gallery-dl, yt-dlp and instaloader in a tmp dir,
  # its own HOME and an empty PATH, under the backend tests' guard. No real
  # tool is looked for or run (the runner's own yt-dlp included), and nothing
  # leaves this machine.
  #
  # Split in shards (frontend/e2e/shards.js: sets of Playwright projects),
  # each a job on a runner of its own, with its own instance built from
  # scratch by its own global setup: no two shards share a vault, a port or
  # a browser, and each starts from the same demo data.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      # Every shard runs to its end: one failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Build UI
        working-directory: frontend
        run: npm run build

      # The headless shell only: the tests never start a headed Chrome.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        working-directory: frontend
        env:
          FEEDVAULT_E2E_PYTHON: ${{ steps.python.outputs.python-path }}
          SHARD: ${{ matrix.shard }}
        run: |
          # On a line of its own: an unknown shard fails here, never runs
          # every project.
          projects=$(node e2e/shards.js "$SHARD")
          echo "shard $SHARD: $projects"
          npm run e2e -- $projects

      # The report, the traces and screenshots, and the backend's log
      # (test-results/backend.log, saved by global-setup.js).
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # The one e2e result for the PR checks: green only if every shard passed
  # (a failed, cancelled or skipped shard fails it).
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: $RESULT"
          test "$RESULT" = success
